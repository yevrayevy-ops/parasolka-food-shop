<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🛍 Магазин</h1><div id="user"></div></header>
<main>
  <section id="catalog"></section>
  <section id="cart" class="cart">
    <h2>🛒 Корзина</h2>
    <div id="cartItems"></div>
    <div class="total">Итого: <strong id="total">0 Ft</strong></div>
    <button id="checkout" disabled>Оформить заказ</button>
  </section>
</main>
<div id="modal" class="modal hidden">
  <div class="box">
    <h2>Оформление заказа</h2>
    <label>Имя<input id="name" placeholder="Ваше имя"></label>
    <label>Телефон<input id="phone" placeholder="+36 ..."></label>
    <label>Комментарий<textarea id="comment" placeholder="Дополнительная информация"></textarea></label>
    <button id="send">Подтвердить заказ</button>
    <button id="close" class="secondary">Назад</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
